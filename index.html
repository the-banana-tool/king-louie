<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>King Louie Chat</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Left Sidebar: Chat History (1/4 width) -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>Chat History</h2>
        <button id="new-chat-btn" class="new-chat-btn">+ New Chat</button>
      </div>
      <div class="chat-list" id="chat-list">
        <!-- Chat items rendered by renderer.js -->
      </div>
      <div class="context-menu" id="chat-context-menu" hidden>
        <button class="context-menu-item danger" type="button" data-action="delete">Delete chat</button>
      </div>
    </div>

    <!-- Right Main Area: Chat Box (3/4 width) -->
    <div class="main-content">
      <div class="chat-header">
        <div>
          <div class="chat-header-title" id="chat-header-title">King Louie Chat</div>
          <div class="chat-header-meta" id="chat-header-meta">Select a chat to begin</div>
        </div>
        <div class="chat-header-actions">
          <button id="open-settings-btn" class="icon-button" title="Open Settings" type="button">™ Settings</button>
        </div>
      </div>

      <div class="empty-state" id="empty-state">
        <h1>Start a conversation</h1>
        <p>Type your first message below to create a new chat.</p>
      </div>
      
      <div class="chat-messages" id="chat-messages">
      </div>

      <div class="input-container">
        <textarea 
          id="user-input" 
          class="user-input" 
          placeholder="Type your message here..."
          rows="3"
        ></textarea>
        <button id="send-btn" class="send-btn">Send</button>
      </div>
    </div>
  </div>

  <div class="settings-drawer" id="settings-drawer" hidden>
    <div class="settings-panel">
      <div class="settings-header">
        <div>
          <h2>API Configuration</h2>
          <p>Manage API keys for supported providers.</p>
        </div>
        <button class="icon-button" id="close-settings-btn" type="button"></button>
      </div>
      <div class="settings-body">
        <div class="settings-alert" id="settings-encryption-alert" hidden>
          Secure storage is not available on this system. Tokens cannot be saved.
        </div>
        <div class="provider-list" id="provider-list"></div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
