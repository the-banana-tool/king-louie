<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Alternate: the banana inside a chat bubble. Copy over icons/src/icon.svg
       and run `npm run icons:build` to use it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d2f52"/>
      <stop offset="1" stop-color="#15162a"/>
    </linearGradient>
    <linearGradient id="peel" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0" stop-color="#ffe866"/>
      <stop offset="0.5" stop-color="#ffcd2b"/>
      <stop offset="1" stop-color="#eea312"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <clipPath id="body-clip">
      <path d="M 318 236 C 372 214 412 246 414 296 C 446 528 606 662 836 660 C 882 660 896 736 846 760 C 542 846 262 700 196 416 C 180 346 230 266 318 236 Z"/>
    </clipPath>
  </defs>
  <rect id="tile" width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <g id="art">
    <path d="M 192 200 H 832 A 90 90 0 0 1 922 290 V 650 A 90 90 0 0 1 832 740 H 420 L 300 850 V 740 H 192 A 90 90 0 0 1 102 650 V 290 A 90 90 0 0 1 192 200 Z"
