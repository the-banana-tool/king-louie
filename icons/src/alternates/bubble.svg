    <g filter="url(#shadow)" transform="translate(512 470) scale(0.6) translate(-545 -500)">
      <path d="M 318 236 C 372 214 412 246 414 296 C 446 528 606 662 836 660 C 882 660 896 736 846 760 C 542 846 262 700 196 416 C 180 346 230 266 318 236 Z" fill="url(#peel)"/>
      <path d="M 372 372 C 436 586 598 714 822 714" fill="none" stroke="#c7860c" stroke-opacity="0.5" stroke-width="20" stroke-linecap="round"/>
      <path d="M 272 460 C 340 640 520 760 770 770" fill="none" stroke="#fff6b0" stroke-opacity="0.5" stroke-width="16" stroke-linecap="round"/>
      <g clip-path="url(#body-clip)"><ellipse cx="872" cy="712" rx="46" ry="62" transform="rotate(20 872 712)" fill="#6a461c"/></g>
      <rect x="300" y="160" width="68" height="120" rx="24" transform="rotate(-14 334 220)" fill="#5a3b1a"/>
    </g>
