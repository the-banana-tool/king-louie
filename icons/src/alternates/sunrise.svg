<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Alternate: the dark banana on a sunrise tile. Copy over icons/src/icon.svg
       and run `npm run icons:build` to use it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe15a"/>
      <stop offset="1" stop-color="#ff9a1f"/>
    </linearGradient>
    <linearGradient id="body" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0" stop-color="#3a3c66"/>
      <stop offset="1" stop-color="#1b1c33"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#7a3d00" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect id="tile" width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <circle id="tile-glow" cx="300" cy="260" r="420" fill="#fff4b0" fill-opacity="0.35"/>
  <g id="art"><g filter="url(#shadow)">
    <path d="M 318 236
