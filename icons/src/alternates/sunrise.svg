    <path d="M 300 228 C 330 196 390 198 416 224 L 414 296 C 390 268 350 266 318 290 Z" fill="#ffffff" fill-opacity="0.92"/>
  </g>
  <g transform="translate(352 150) rotate(-14)" filter="url(#shadow)">
    <path d="M -118 60 L -92 -56 L -36 12 L 0 -92 L 36 12 L 92 -56 L 118 60 Z" fill="#ffffff"/>
    <rect x="-124" y="52" width="248" height="46" rx="12" fill="#ffffff"/>
    <circle cx="-92" cy="-62" r="17" fill="#1b1c33"/>
    <circle cx="0" cy="-98" r="20" fill="#1b1c33"/>
    <circle cx="92" cy="-62" r="17" fill="#1b1c33"/>
  </g>
</g></svg>
