name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        # Not ubuntu-latest: package.json pins playwright exactly (its private
        # snapshot API), and that version refuses to install on Ubuntu 26.04.
        # Windows runs only on main: each leg takes about 50 minutes, so a pull
        # request relies on `npm test` run locally on Windows before the merge.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-24.04", "macos-latest"]') || fromJSON('["ubuntu-24.04", "windows-latest", "macos-latest"]') }}
        # 22 is the floor package.json engines promises (king-louie-service
        # runs on the system Node); 24 is what Electron 41 bundles, so it is
        # the runtime the desktop app actually ships on.
        node: [22, 24]
    name: unit (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The browser tests drive Playwright's own Chromium (never the runner's
      # Chrome), and npm ci does not download it. On Linux --with-deps also
      # installs the system libraries it loads.
      - run: npx playwright install --with-deps chromium
      - run: npm test
        if: runner.os != 'Windows'
      # npm test's command with fewer files at once. At the default concurrency
      # a different timing-sensitive test failed on most Windows runs.
      - run: node --test --test-concurrency=2 --test-timeout=600000 tests/*.test.js
        if: runner.os == 'Windows'
      # Diagnostic only (never fails the job): tests/mesh-hardening.test.js
      # dies with SIGABRT on macOS, deterministically, inside 'an attacker
      # holding 8 sockets on the same address cannot keep a valid peer out',
      # and passes on Linux and Windows. `node --test` discards a child's
      # stderr when the child dies on a signal, so the abort message reaches
      # no log — this runs the file directly instead, which keeps stderr, and
      # asks for a diagnostic report on the fatal error. Delete this step
      # once the crash is understood.
      - name: Diagnose the mesh-hardening abort (macOS)
        if: always() && runner.os == 'macOS'
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/mesh-diag"
          { echo "node: $(node -v)"; echo "arch: $(uname -m)"; echo "open files (ulimit -n): $(ulimit -n)";
            echo "--- lo0 aliases (127.0.0.2-9 are not configured on macOS by default):";
            ifconfig lo0 || true; } > "$RUNNER_TEMP/mesh-diag/env.txt" 2>&1
          set +e
          node --report-on-fatalerror --report-uncaught-exception \
               --report-directory="$RUNNER_TEMP/mesh-diag" \
               tests/mesh-hardening.test.js > "$RUNNER_TEMP/mesh-diag/run.log" 2>&1
          echo "exit=$? (0 means it did not reproduce this run)" | tee -a "$RUNNER_TEMP/mesh-diag/run.log"
          set -e
          # Whatever the kernel wrote for the abort, if anything.
          cp ~/Library/Logs/DiagnosticReports/node*.ips "$RUNNER_TEMP/mesh-diag/" 2>/dev/null || true
          tail -40 "$RUNNER_TEMP/mesh-diag/run.log"
      - name: Upload the mesh-hardening diagnostics
        if: always() && runner.os == 'macOS'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mesh-diag-node${{ matrix.node }}
          path: ${{ runner.temp }}/mesh-diag
          if-no-files-found: warn
      - run: node bin/longhaul.js run --sessions tests/fixtures/longhaul --adapters sliding-window,oracle
        env:
          LONGHAUL_HOME: ${{ runner.temp }}/longhaul
      - run: node bin/longhaul.js run --sessions tests/fixtures/longhaul --adapters sliding-window,oracle,summarize-compact,real-compaction --fake-models
        env:
          LONGHAUL_HOME: ${{ runner.temp }}/longhaul

  # The only compile of the phone cores against the vectors: npm test reads
  # their sources and compiles no Kotlin or Swift. The protocol core is its own
  # Gradle build, so it needs no Android SDK.
  phone-cores-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - run: cd mobile/android/protocol && ../gradlew test --no-daemon

  phone-cores-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - run: cd mobile/ios/KLProtocol && swift test
